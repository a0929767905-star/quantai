<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuantAI 台股智能分析</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#05050a;--card:#0d0f1b;--border:#1a1f35;--cyan:#00d4ff;--green:#00e87a;--red:#ff3355;--yellow:#ffd700;--purple:#a78bfa;--muted:#8892b0;--text:#e2e8f0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',sans-serif;font-size:13px}
.mono{font-family:'Courier New',monospace;font-variant-numeric:tabular-nums}
.up{color:var(--green)}.dn{color:var(--red)}.cy{color:var(--cyan)}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.4}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes blink{50%{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.spin{animation:spin .9s linear infinite}
.sk{background:linear-gradient(90deg,#0d0f1b 25%,#1a1f35 50%,#0d0f1b 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:4px}
.cursor::after{content:'▋';animation:blink .8s step-end infinite;color:var(--cyan)}
.htab,.atab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 14px;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;transition:.15s;margin-bottom:-1px;white-space:nowrap}
.htab.active,.atab.active{border-bottom-color:var(--cyan);color:var(--cyan)}
.qb{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:7px;padding:4px 10px;color:#94a3b8;font-size:11px;cursor:pointer;font-family:inherit;transition:.15s}
.qb:hover{border-color:var(--cyan);color:var(--cyan)}
.row:hover{background:rgba(255,255,255,.04);cursor:pointer}
.grid-bg{background-image:linear-gradient(rgba(0,212,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.02) 1px,transparent 1px);background-size:40px 40px}
</style>
</head>
<body class="grid-bg">

<!-- TICKER -->
<div style="background:rgba(0,212,255,.07);border-bottom:1px solid rgba(0,212,255,.2);padding:5px 0;overflow:hidden;white-space:nowrap;height:30px;display:flex;align-items:center">
  <div id="tape" style="display:inline-flex;gap:16px;font-size:11px">
    <span style="color:var(--muted);padding:0 12px">⚡ 載入即時行情中...</span>
  </div>
</div>

<!-- NAV -->
<div style="background:rgba(5,5,10,.97);border-bottom:1px solid var(--border);padding:7px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100">
  <div style="display:flex;align-items:center;gap:8px;cursor:pointer" onclick="showHome()">
    <div style="width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#00d4ff,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:14px">⚡</div>
    <span style="font-weight:700;font-size:15px"><span class="cy">QUANT</span><span style="color:#fff">AI</span></span>
    <span style="font-size:9px;padding:2px 6px;border-radius:4px;background:rgba(0,212,255,.12);color:var(--cyan);border:1px solid rgba(0,212,255,.3)">LIVE</span>
  </div>
  <div style="display:flex;gap:16px;align-items:center" id="nav-idx">
    <span style="color:var(--muted);font-size:11px">載入中...</span>
  </div>
  <div style="display:flex;align-items:center;gap:5px">
    <div id="live-dot" style="width:6px;height:6px;border-radius:50%;background:var(--muted)"></div>
    <span id="mkt-st" style="font-size:10px;color:var(--muted)">連線中</span>
  </div>
</div>

<!-- HOME -->
<div id="home" style="padding:16px;max-width:960px;margin:0 auto">
  <div style="text-align:center;padding:16px 0 18px">
    <div style="display:inline-flex;gap:5px;align-items:center;padding:3px 12px;border-radius:20px;border:1px solid rgba(0,212,255,.4);background:rgba(0,212,255,.08);font-size:10px;color:var(--cyan);margin-bottom:12px">
      ⚡ Yahoo Finance 即時報價 · 延遲15分鐘 · AI深度分析
    </div>
    <h1 style="font-size:26px;font-weight:700;margin-bottom:6px"><span class="cy">QuantAI</span><span style="color:#fff"> 台股智能分析</span></h1>
    <p style="color:var(--muted);font-size:13px;margin-bottom:16px">真實即時行情 · Claude AI深度分析 · 法人籌碼 · 技術評分</p>
    <div style="max-width:480px;margin:0 auto 12px;display:flex;gap:8px">
      <div class="card" style="flex:1;display:flex;align-items:center;gap:8px;padding:0 14px;border-color:rgba(0,212,255,.35)">
        <span style="color:var(--muted);font-size:16px">🔍</span>
        <input id="si" placeholder="輸入股票代號（例：2330）" style="flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;padding:11px 0;font-family:inherit"/>
      </div>
      <button onclick="doSearch()" style="background:linear-gradient(135deg,#00d4ff,#a78bfa);color:#000;border:none;border-radius:9px;padding:0 20px;font-weight:700;font-size:14px;cursor:pointer">分析</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px">
      <span style="color:var(--muted);font-size:10px;align-self:center">熱門：</span>
      <button class="qb" onclick="goA('2330.TW','2330','台積電')">台積電 2330</button>
      <button class="qb" onclick="goA('2454.TW','2454','聯發科')">聯發科 2454</button>
      <button class="qb" onclick="goA('2382.TW','2382','廣達')">廣達 2382</button>
      <button class="qb" onclick="goA('2308.TW','2308','台達電')">台達電 2308</button>
      <button class="qb" onclick="goA('2317.TW','2317','鴻海')">鴻海 2317</button>
      <button class="qb" onclick="goA('6669.TW','6669','緯穎')">緯穎 6669</button>
    </div>
  </div>

  <div style="display:flex;border-bottom:1px solid var(--border);margin-bottom:14px">
    <button class="htab active" onclick="swH('mkt',this)">📊 即時行情</button>
    <button class="htab" onclick="swH('rank',this)">🚀 漲跌排行</button>
    <button class="htab" onclick="swH('picks',this)">🤖 AI精選</button>
  </div>

  <div id="hp-mkt">
    <div id="mkt-status" style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:11px;color:var(--muted)">
      <div class="spin" style="width:13px;height:13px;border:2px solid var(--cyan);border-top-color:transparent;border-radius:50%"></div>
      正在從 Yahoo Finance 抓取即時資料...
    </div>
    <div id="mkt-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px"></div>
  </div>
  <div id="hp-rank" style="display:none"><div class="card" id="rank-tbl"></div></div>
  <div id="hp-picks" style="display:none"><div id="picks-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div></div>
</div>

<!-- ANALYSIS -->
<div id="ana" style="display:none;padding:16px;max-width:960px;margin:0 auto">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
    <button onclick="showHome()" style="background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:7px;padding:5px 12px;color:var(--text);cursor:pointer;font-size:12px">← 返回</button>
    <div id="a-hdr"></div>
    <button onclick="reloadA()" style="margin-left:auto;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.3);border-radius:7px;padding:5px 10px;color:var(--cyan);cursor:pointer;font-size:11px">🔄 更新報價</button>
  </div>
  <div id="p-card" class="card" style="padding:16px;margin-bottom:12px;background:linear-gradient(135deg,rgba(0,212,255,.04),rgba(167,139,250,.04))">
    <div style="display:flex;align-items:center;gap:8px">
      <div class="spin" style="width:16px;height:16px;border:2px solid var(--cyan);border-top-color:transparent;border-radius:50%"></div>
      <span style="color:var(--muted)">抓取即時股價中...</span>
    </div>
  </div>
  <div id="w-bar" class="card" style="padding:10px;margin-bottom:12px;display:none"></div>
  <div style="display:flex;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto">
    <button class="atab active" onclick="swA('ov',this)">總覽</button>
    <button class="atab" onclick="swA('ai',this)">AI深度分析</button>
    <button class="atab" onclick="swA('ch',this)">籌碼法人</button>
    <button class="atab" onclick="swA('sc',this)">AI評分</button>
  </div>
  <div id="ap-ov"></div>
  <div id="ap-ai" style="display:none"></div>
  <div id="ap-ch" style="display:none"></div>
  <div id="ap-sc" style="display:none"></div>
</div>

<script>
const WATCHLIST = ['2330.TW','2317.TW','2454.TW','2382.TW','2308.TW','6669.TW','3034.TW','3711.TW','2412.TW','2886.TW'];
const PICKS = [
  {sym:'2330.TW',code:'2330',name:'台積電',score:94,reason:'AI需求爆發，CoWoS全球獨家製造'},
  {sym:'6669.TW',code:'6669',name:'緯穎',score:92,reason:'Q1 EPS 75.95元，年增185%'},
  {sym:'2382.TW',code:'2382',name:'廣達',score:89,reason:'4月營收年增121%，AI伺服器爆發'},
  {sym:'2308.TW',code:'2308',name:'台達電',score:86,reason:'AI電源供應核心受惠'},
  {sym:'2454.TW',code:'2454',name:'聯發科',score:83,reason:'Dimensity旗艦晶片超預期'},
  {sym:'2317.TW',code:'2317',name:'鴻海',score:80,reason:'AI伺服器組裝龍頭'},
];

let cache = {}, curSym='', curCode='', curName='';

// ── Fetch via local proxy ──────────────────────────────────────────
async function fetchQuote(symbols) {
  const joined = Array.isArray(symbols) ? symbols.join(',') : symbols;
  const r = await fetch(`/api/quote?symbols=${joined}`);
  if (!r.ok) throw new Error('fetch failed');
  const data = await r.json();
  return data.quoteResponse?.result || [];
}

function fmtN(n, d=2){ const v=parseFloat(n); return isNaN(v)?'—':v.toFixed(d).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function fmtBig(n){ if(!n||isNaN(n)) return '—'; if(n>=1e12) return (n/1e12).toFixed(2)+'兆'; if(n>=1e8) return (n/1e8).toFixed(0)+'億'; return n.toLocaleString(); }
function shortName(q){ return (q.shortName||q.symbol||'').replace(' Inc.','').replace(' Co.','').replace(' Corporation','').replace(', Ltd.','').substring(0,8); }

// ── Init ──────────────────────────────────────────────────────────
async function init() {
  try {
    const quotes = await fetchQuote(WATCHLIST);
    quotes.forEach(q => cache[q.symbol] = q);
    buildTicker(quotes);
    buildMktGrid(quotes);
    buildRankTable(quotes);
    buildNavIdx(quotes);
    document.getElementById('mkt-status').innerHTML = `<span style="color:var(--green)">✓ Yahoo Finance 即時資料 · ${new Date().toLocaleTimeString('zh-TW')} · 每60秒更新</span>`;
    document.getElementById('live-dot').style.cssText = 'width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite';
    document.getElementById('mkt-st').textContent = '即時';
    // Auto refresh every 60s
    setTimeout(init, 60000);
  } catch(e) {
    document.getElementById('mkt-status').innerHTML = `<span style="color:var(--red)">⚠ 無法取得即時資料：${e.message}</span>`;
    document.getElementById('live-dot').style.background = 'var(--red)';
  }
}

function buildNavIdx(quotes) {
  const tse = quotes.find(q=>q.symbol==='2330.TW');
  if (!tse) return;
  const el = document.getElementById('nav-idx');
  el.innerHTML = quotes.slice(0,3).map(q=>{
    const up = q.regularMarketChange>=0;
    return `<div style="text-align:center">
      <div style="font-size:9px;color:var(--muted)">${shortName(q)}</div>
      <div class="mono ${up?'up':'dn'}" style="font-size:11px;font-weight:600">${fmtN(q.regularMarketPrice,1)} <span style="font-size:9px">${up?'+':''}${fmtN(q.regularMarketChangePercent,2)}%</span></div>
    </div>`;
  }).join('');
}

function buildTicker(quotes) {
  const tape = document.getElementById('tape');
  const all = [...quotes,...quotes];
  tape.innerHTML = all.map(q=>{
    const up=q.regularMarketChange>=0;
    return `<span style="display:inline-flex;align-items:center;gap:5px">
      <span style="color:#475569">${q.symbol.replace('.TW','')}</span>
      <span style="color:#fff;font-weight:600">${shortName(q)}</span>
      <span class="mono" style="color:#fff">${fmtN(q.regularMarketPrice,1)}</span>
      <span class="mono ${up?'up':'dn'}">${up?'+':''}${fmtN(q.regularMarketChangePercent,2)}%</span>
      <span style="color:#1e293b;margin:0 3px">│</span>
    </span>`;
  }).join('');
  tape.style.animation='ticker 28s linear infinite';
}

function buildMktGrid(quotes) {
  document.getElementById('mkt-grid').innerHTML = quotes.map(q=>{
    const up=q.regularMarketChange>=0;
    const pct=Math.abs(q.regularMarketChangePercent||0);
    const code=q.symbol.replace('.TW','');
    return `<div class="card" style="padding:10px;cursor:pointer;animation:fadeUp .3s ease" onclick="goA('${q.symbol}','${code}','${shortName(q)}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
        <div>
          <div style="color:#fff;font-weight:600;font-size:12px">${shortName(q)}</div>
          <div style="color:var(--muted);font-size:10px">${code}</div>
        </div>
        <div style="text-align:right">
          <div class="mono" style="font-size:17px;font-weight:700;color:#fff">${fmtN(q.regularMarketPrice,1)}</div>
          <div class="mono ${up?'up':'dn'}" style="font-size:11px">${up?'+':''}${fmtN(q.regularMarketChange,2)}</div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:5px">
        <span>量 ${q.regularMarketVolume?Math.floor(q.regularMarketVolume/1000).toLocaleString()+'K':'—'}</span>
        <span class="${up?'up':'dn'}">${up?'▲':'▼'} ${pct.toFixed(2)}%</span>
      </div>
      <div style="height:3px;border-radius:2px;background:#1a1f35">
        <div style="height:100%;border-radius:2px;background:${up?'var(--green)':'var(--red)'};width:${Math.min(pct*20,100).toFixed(0)}%"></div>
      </div>
    </div>`;
  }).join('');
}

function buildRankTable(quotes) {
  const sorted = [...quotes].sort((a,b)=>(b.regularMarketChangePercent||0)-(a.regularMarketChangePercent||0));
  document.getElementById('rank-tbl').innerHTML = `
    <div style="padding:8px 12px;border-bottom:1px solid var(--border);font-size:11px;color:var(--cyan);font-weight:600">🚀 今日漲幅排行（即時）</div>
    <table style="width:100%;border-collapse:collapse">
      <thead><tr style="border-bottom:1px solid var(--border)">
        <th style="padding:7px 10px;text-align:left;color:var(--muted);font-weight:400;font-size:10px">#</th>
        <th style="padding:7px 10px;text-align:left;color:var(--muted);font-weight:400;font-size:10px">股票</th>
        <th style="padding:7px 10px;text-align:right;color:var(--muted);font-weight:400;font-size:10px">現價</th>
        <th style="padding:7px 10px;text-align:right;color:var(--muted);font-weight:400;font-size:10px">漲跌</th>
        <th style="padding:7px 10px;text-align:right;color:var(--muted);font-weight:400;font-size:10px">漲跌幅</th>
        <th style="padding:7px 10px;text-align:right;color:var(--muted);font-weight:400;font-size:10px">成交量</th>
      </tr></thead>
      <tbody>${sorted.map((q,i)=>{
        const up=q.regularMarketChange>=0;
        const code=q.symbol.replace('.TW','');
        return `<tr class="row" onclick="goA('${q.symbol}','${code}','${shortName(q)}')" style="border-bottom:1px solid rgba(255,255,255,.04)">
          <td style="padding:8px 10px;color:var(--muted)">${i+1}</td>
          <td style="padding:8px 10px"><span style="color:#fff;font-weight:500">${shortName(q)}</span><span style="color:var(--muted);font-size:10px;margin-left:4px">${code}</span></td>
          <td class="mono" style="padding:8px 10px;text-align:right;color:#fff">${fmtN(q.regularMarketPrice,2)}</td>
          <td class="mono ${up?'up':'dn'}" style="padding:8px 10px;text-align:right">${up?'+':''}${fmtN(q.regularMarketChange,2)}</td>
          <td class="mono ${up?'up':'dn'}" style="padding:8px 10px;text-align:right;font-weight:700">${up?'+':''}${fmtN(q.regularMarketChangePercent,2)}%</td>
          <td style="padding:8px 10px;text-align:right;color:var(--muted)">${q.regularMarketVolume?Math.floor(q.regularMarketVolume/1000).toLocaleString()+'K':'—'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
}

function buildPicksGrid() {
  const el = document.getElementById('picks-grid');
  const picksWithCache = PICKS.map(p => ({...p, q: cache[p.sym]}));
  el.innerHTML = picksWithCache.map((p,i)=>{
    const q=p.q, up=q?(q.regularMarketChange>=0):true;
    const priceStr=q?`${fmtN(q.regularMarketPrice,1)} <span class="${up?'up':'dn'}">${up?'+':''}${fmtN(q.regularMarketChangePercent,2)}%</span>`:'載入中...';
    const col=p.score>=90?'var(--green)':p.score>=85?'var(--cyan)':'var(--yellow)';
    const r=18,circ=2*Math.PI*r,off=circ-(p.score/100)*circ;
    const topSt=i<3?'background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000':'background:rgba(255,255,255,.1);color:#888';
    return `<div class="card" style="padding:11px;cursor:pointer" onclick="goA('${p.sym}','${p.code}','${p.name}')">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
        <span style="width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;${topSt}">${i+1}</span>
        <div style="flex:1">
          <div style="color:#fff;font-weight:600;font-size:12px">${p.name} <span class="mono" style="font-size:11px">${priceStr}</span></div>
        </div>
        <svg width="38" height="38" style="flex-shrink:0">
          <circle cx="19" cy="19" r="${r}" fill="none" stroke="#1a1f35" stroke-width="4"/>
          <circle cx="19" cy="19" r="${r}" fill="none" stroke="${col}" stroke-width="4" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 19 19)"/>
          <text x="19" y="19" text-anchor="middle" dominant-baseline="middle" fill="${col}" font-size="10" font-weight="700" font-family="monospace">${p.score}</text>
        </svg>
      </div>
      <div style="font-size:10px;color:var(--muted)">${p.reason}</div>
    </div>`;
  }).join('');
}

function swH(id,btn){
  document.querySelectorAll('.htab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['mkt','rank','picks'].forEach(t=>document.getElementById('hp-'+t).style.display=t===id?'block':'none');
  if(id==='picks') buildPicksGrid();
}

function doSearch(){
  const v=document.getElementById('si').value.trim();
  if(!v) return;
  const code=v.replace(/\D/g,'');
  const sym=code+'.TW';
  const known=cache[sym];
  goA(sym, code, known?shortName(known):code);
}
document.getElementById('si').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});

function showHome(){ document.getElementById('home').style.display='block'; document.getElementById('ana').style.display='none'; }
function reloadA(){ loadAna(curSym,curCode,curName); }

function goA(sym,code,name){
  curSym=sym; curCode=code; curName=name||code;
  document.getElementById('home').style.display='none';
  document.getElementById('ana').style.display='block';
  document.querySelectorAll('.atab').forEach((b,i)=>b.classList.toggle('active',i===0));
  ['ov','ai','ch','sc'].forEach((t,i)=>{document.getElementById('ap-'+t).style.display=i===0?'block':'none';});
  document.getElementById('ap-ov').innerHTML='';
  document.getElementById('ap-ai').innerHTML='';
  document.getElementById('ap-ch').innerHTML='';
  document.getElementById('ap-sc').innerHTML='';
  loadAna(sym,code,name||code);
}

async function loadAna(sym,code,name){
  document.getElementById('a-hdr').innerHTML=`<span style="color:var(--muted);font-size:12px">⏳ 抓取 ${name}（${code}）即時報價...</span>`;
  document.getElementById('p-card').innerHTML=`<div style="display:flex;align-items:center;gap:8px"><div class="spin" style="width:16px;height:16px;border:2px solid var(--cyan);border-top-color:transparent;border-radius:50%"></div><span style="color:var(--muted)">Yahoo Finance 即時資料載入中...</span></div>`;
  document.getElementById('w-bar').style.display='none';
  try {
    let q = cache[sym];
    if(!q){
      const res = await fetchQuote([sym]);
      q = res[0];
      if(q) cache[sym]=q;
    }
    if(!q) throw new Error('找不到此股票代號');
    renderAna(q,code);
  } catch(e){
    document.getElementById('p-card').innerHTML=`<div style="color:var(--red)">⚠ ${e.message}。請確認股票代號正確（例：2330、2454）</div>`;
    document.getElementById('a-hdr').innerHTML=`<span style="color:var(--red)">${code}</span>`;
  }
}

function ring(score,label,color,sz=56){
  const r=sz/2-7,circ=2*Math.PI*r,off=circ-(score/100)*circ;
  return `<div style="text-align:center">
    <svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">
      <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#1a1f35" stroke-width="5"/>
      <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 ${sz/2} ${sz/2})"/>
      <text x="${sz/2}" y="${sz/2}" text-anchor="middle" dominant-baseline="middle" fill="${color}" font-size="12" font-weight="700" font-family="monospace">${score}</text>
    </svg>
    <div style="font-size:10px;color:var(--muted);margin-top:2px">${label}</div>
  </div>`;
}

function buildChipTab(){

  document.getElementById('ap-ch').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">

}

function swA(id,btn){
  document.querySelectorAll('.atab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['ov','ai','ch','sc'].forEach(t=>document.getElementById('ap-'+t).style.display=t===id?'block':'none');
  if(id==='ai'&&!document.getElementById('ap-ai').innerHTML) buildAITab();
  if(id==='ch'&&!document.getElementById('ap-ch').innerHTML) buildChipTab();
  if(id==='sc'&&!document.getElementById('ap-sc').innerHTML) buildScoreTab();
}

async function streamAI(tid,sid,prompt){
  const tgt=document.getElementById(tid), sts=document.getElementById(sid);
  if(!tgt) return;
  tgt.textContent=''; tgt.className='cursor';
  if(sts){sts.textContent='分析中...';sts.style.color='var(--cyan)';}
  try{
    const res=await fetch('/api/ai',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:700,stream:true,messages:[{role:'user',content:prompt}]})
    });
    if(!res.ok) throw new Error(`${res.status}`);
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true){
      const{done,value}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop()||'';
      for(const line of lines){
        if(!line.startsWith('data:')) continue;
        const d=line.slice(5).trim(); if(d==='[DONE]') break;
        try{const j=JSON.parse(d);if(j.type==='content_block_delta'&&j.delta?.text)tgt.textContent+=j.delta.text;}catch{}
      }
    }
    tgt.className='';
    if(sts){sts.textContent='✓ 完成';sts.style.color='var(--green)';}
  }catch(e){
    tgt.className='';
    tgt.textContent='AI分析載入失敗：'+e.message;
    if(sts){sts.textContent='失敗';sts.style.color='var(--red)';}
  }
}

async function streamInto(tid,sid,prompt){
  const tgt=document.getElementById(tid); if(!tgt) return;
  tgt.innerHTML=''; tgt.className='cursor';
  try{
    const res=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,stream:true,messages:[{role:'user',content:prompt}]})});
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true){
      const{done,value}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop()||'';
      for(const line of lines){
        if(!line.startsWith('data:')) continue;
        const d=line.slice(5).trim(); if(d==='[DONE]') break;
        try{const j=JSON.parse(d);if(j.type==='content_block_delta'&&j.delta?.text)tgt.textContent+=j.delta.text;}catch{}
      }
    }
    tgt.className='';
  }catch{}
}
